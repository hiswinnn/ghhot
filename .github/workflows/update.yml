name: update-hot

on:
  schedule:
    - cron: "5 22 * * *"   # 每天 22:05 UTC = 北京 06:05
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Collect
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 collector.py --out data/ghhot.json
      - name: Commit
        run: |
          git config user.name "gh-hot bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/ghhot.json
          git diff --cached --quiet || git commit -m "chore: update hot list $(date -u +%F)"
          git push
