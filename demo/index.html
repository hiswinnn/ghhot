<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>gh-hot · GitHub 项目热榜</title>
<style>
:root{color-scheme:light;--bg:#f7f9fd;--ink:#1a1f27;--ink2:#5c6675;--ink3:#8b95a5;
  --line:rgba(24,36,56,.09);--card:#fff;--accent:#5d8ff0}
@media (prefers-color-scheme:dark){:root{color-scheme:dark;--bg:#0c0f14;--ink:#e9edf4;--ink2:#98a2b1;
  --ink3:#6f7987;--line:rgba(255,255,255,.08);--card:#151a21;--accent:#7aa6ff}}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  padding:40px 18px 60px;-webkit-font-smoothing:antialiased}
.wrap{max-width:760px;margin:0 auto}
h1{font-size:20px;font-weight:600;letter-spacing:.08em}
.sub{margin-top:8px;font-size:12px;color:var(--ink3);letter-spacing:.06em}
.tabs{display:flex;gap:8px;margin:20px 0 16px;flex-wrap:wrap}
.tab{padding:7px 14px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--ink2);
  font-size:12px;cursor:pointer;font-family:inherit}
.tab.on{background:var(--accent);border-color:var(--accent);color:#fff}
.item{display:flex;gap:14px;padding:14px 16px;border-radius:14px;background:var(--card);border:1px solid var(--line);margin-bottom:10px}
.rank{width:22px;flex:none;font-size:12px;color:var(--ink3)}
.main{flex:1;min-width:0}
.name{font-size:14px;font-weight:600;color:var(--ink);text-decoration:none;word-break:break-all}
.name:hover{color:var(--accent)}
.desc{margin-top:6px;font-size:12.5px;line-height:1.7;color:var(--ink2);
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.meta{margin-top:8px;display:flex;gap:14px;font-size:11px;color:var(--ink3);flex-wrap:wrap}
.star{flex:none;align-self:flex-start;padding:6px 11px;border-radius:9px;border:1px solid var(--line);
  color:var(--ink2);text-decoration:none;font-size:11.5px}
.star:hover{color:#e3b341;border-color:#e3b341}
.empty{font-size:12px;color:var(--ink3);padding:20px 0}
</style>
</head>
<body>
<div class="wrap">
  <h1>GitHub 项目热榜</h1>
  <p class="sub" id="upd">读取中…</p>
  <div class="tabs" id="tabs"></div>
  <div id="list"></div>
</div>
<script>
(function () {
  var data = null, range = 'day';
  var list = document.getElementById('list');
  var tabs = document.getElementById('tabs');
  var upd = document.getElementById('upd');

  function fmt(n) { return n >= 1000 ? (n / 1000).toFixed(n >= 10000 ? 0 : 1) + 'k' : String(n); }

  function render() {
    if (!data) return;
    var r = (data.ranges || {})[range] || { items: [] };
    list.innerHTML = '';
    if (!r.items || !r.items.length) {
      list.innerHTML = '<div class="empty">这一档暂时没有数据</div>';
      return;
    }
    r.items.forEach(function (it) {
      var row = document.createElement('div'); row.className = 'item';
      var rank = document.createElement('div'); rank.className = 'rank'; rank.textContent = it.rank;
      var main = document.createElement('div'); main.className = 'main';
      var a = document.createElement('a'); a.className = 'name'; a.href = it.html_url; a.target = '_blank'; a.rel = 'noopener';
      a.textContent = it.full_name;
      main.appendChild(a);
      if (it.description) {
        var d = document.createElement('div'); d.className = 'desc'; d.textContent = it.description; main.appendChild(d);
      }
      var meta = document.createElement('div'); meta.className = 'meta';
      meta.innerHTML = '★ <b>' + fmt(it.stars) + '</b>' + (it.gained ? '　+' + fmt(it.gained) : '') +
        (it.language ? '　' + it.language : '');
      main.appendChild(meta);
      var star = document.createElement('a'); star.className = 'star'; star.href = it.html_url;
      star.target = '_blank'; star.rel = 'noopener'; star.textContent = '☆ Star';
      row.appendChild(rank); row.appendChild(main); row.appendChild(star);
      list.appendChild(row);
    });
  }

  fetch('../data/ghhot.json', { cache: 'no-store' })
    .then(function (r) { return r.json(); })
    .then(function (d) {
      data = d;
      var labels = { day: '今日', week: '本周', month: '本月', year: '今年' };
      Object.keys(labels).forEach(function (k) {
        var b = document.createElement('button');
        b.className = 'tab' + (k === 'day' ? ' on' : '');
        b.textContent = labels[k];
        b.dataset.r = k;
        tabs.appendChild(b);
      });
      tabs.addEventListener('click', function (e) {
        var b = e.target.closest('.tab'); if (!b) return;
        range = b.dataset.r;
        Array.prototype.forEach.call(tabs.children, function (x) { x.classList.toggle('on', x === b); });
        render();
      });
      if (d.updated_at) upd.textContent = '更新于 ' + new Date(d.updated_at * 1000).toLocaleString('zh-CN', { hour12: false });
      render();
    })
    .catch(function () { upd.textContent = '读取失败：请用本地服务器打开（python3 -m http.server）'; list.innerHTML = ''; });
})();
</script>
</body>
</html>
